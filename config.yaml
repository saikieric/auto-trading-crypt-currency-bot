bot:
  dry_run: false
  log_level: "DEBUG"      # DEBUG | INFO | WARNING | ERROR

exchanges:
  bitflyer:
    enabled: false
    trading_fee_pct: 0.15
  gmo:
    enabled: false
    trading_fee_pct: 0.0
  bitbank:
    enabled: true
    trading_fee_pct: 0.12   # テイカー手数料

risk:
  starting_capital_jpy: 100000
  max_trade_amount_jpy: 30000
  max_daily_loss_jpy: 5000
  max_open_positions: 3

strategy:
  active: "trend"

  trend:                    # bitFlyer BTC/JPY EMAクロス
    timeframe: "15m"
    fast_period: 9
    slow_period: 21
    signal_confirmation_bars: 2
    min_signal_confidence: 0.0

  sol_trend:                # Bitbank SOL/JPY EMAクロス
    timeframe: "15m"
    fast_period: 9
    slow_period: 21
    signal_confirmation_bars: 2
    min_signal_confidence: 0.0
    use_maker_orders: true
    maker_timeout_seconds: 30

  arbitrage:                # bitFlyer ↔ Bitbank BTC/JPY アービトラージ
    min_spread_pct: 0.30    # bitFlyer 0.15% + Bitbank 0.12% = 0.27% なので0.30%以上
    cooldown_seconds: 120
    exchanges:
      - "bitflyer"
      - "bitbank"

data:
  ohlcv_poll_interval_seconds: 60
  ticker_refresh_interval_seconds: 2
  ohlcv_history_candles: 50

notifications:
  # discord_webhook_url は .env の DISCORD_WEBHOOK_URL から自動注入
  heartbeat_interval_hours: 6
  notify_on:
    - "trade_open"
    - "trade_close"
    - "risk_rejected"
    - "daily_summary"
    - "error"
    - "bot_start"
    - "bot_stop"

storage:
  db_path: "storage/trades.db"
  state_path: "storage/state.json"
  log_path: "logs/bot.log"
  log_rotation: "100 MB"
  log_retention: "30 days"
